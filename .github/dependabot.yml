# Dependabot will run on day 3 of each month at 03:14 (Europe/Berlin timezone)
version: 2
updates:

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "cron"
      timezone: "Europe/Berlin"
      cronjob: "14 3 3 * *"
    open-pull-requests-limit: 15
    assignees:
      - "Chris-656"
    versioning-strategy: "increase"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      timezone: "Europe/Berlin"
      cronjob: "14 3 3 * *"
    open-pull-requests-limit: 15
    assignees:
      - "Chris-656"
